name: Kinetics CI

on:
  push:
    branches: [main, "kinetics/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "rdkit>=2023.9"

      - name: Lint new foundation modules
        run: python -m ruff check src/kinetics_core/legacy.py src/kinetics_core/cli.py src/kinetics_core/__init__.py src/kinetics_core/persistence.py src/kinetics_core/catpred.py src/kinetics_core/identity.py src/kinetics_core/release.py tests/test_legacy_adapter.py tests/test_persistence.py tests/test_catpred_adapter.py tests/test_kdb_release.py

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run test suite
        run: python -m pytest -q
