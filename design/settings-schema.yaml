schema_version: 1
status: U0 skeleton; settings become available only when implemented and tested
settings:
  - key: appearance.theme
    type: enum
    values: [system, light, dark, amoled, high_contrast_light, high_contrast_dark, dynamic, brand, custom_seed, lab]
    default: system
    scope: device
    security_class: ordinary
    ui_location: Settings/Appearance
    status: planned
  - key: appearance.accent_seed
    type: color
    default: null
    scope: device
    security_class: ordinary
    ui_location: Settings/Appearance
    status: planned
  - key: appearance.corner_style
    type: enum
    values: [sharp, standard, rounded]
    default: standard
    scope: device
    security_class: ordinary
    ui_location: Settings/Appearance
    status: planned
  - key: appearance.density
    type: enum
    values: [compact, comfortable, spacious]
    default: comfortable
    scope: device
    security_class: ordinary
    ui_location: Settings/Appearance
    status: planned
  - key: appearance.font_scale
    type: number
    min: 1.0
    max: 2.0
    default: 1.0
    scope: device
    security_class: ordinary
    ui_location: Settings/Accessibility
    status: planned
  - key: accessibility.reduce_motion
    type: boolean
    default: false
    scope: device
    security_class: ordinary
    ui_location: Settings/Accessibility
    status: planned
  - key: accessibility.high_contrast
    type: boolean
    default: false
    scope: device
    security_class: ordinary
    ui_location: Settings/Accessibility
    status: planned
  - key: accessibility.color_vision_safe
    type: boolean
    default: true
    scope: device
    security_class: ordinary
    ui_location: Settings/Accessibility
    status: planned
  - key: scientific.units
    type: enum
    values: [SI]
    default: SI
    scope: project
    security_class: ordinary
    ui_location: Settings/Scientific display
    status: planned
  - key: scientific.significant_figures
    type: integer
    min: 2
    max: 12
    default: 4
    scope: project
    security_class: ordinary
    ui_location: Settings/Scientific display
    status: planned
  - key: compute.preference
    type: enum
    values: [on_device, ask, remote_node]
    default: on_device
    scope: project
    security_class: sensitive
    ui_location: Settings/Compute
    status: planned
  - key: data.wifi_only_downloads
    type: boolean
    default: true
    scope: device
    security_class: ordinary
    ui_location: Settings/Data
    status: planned
  - key: privacy.offline_only
    type: boolean
    default: true
    scope: device
    security_class: sensitive
    ui_location: Settings/Privacy
    status: planned
  - key: privacy.hide_sensitive_recents
    type: boolean
    default: true
    scope: device
    security_class: sensitive
    ui_location: Settings/Privacy
    status: planned
  - key: security.app_lock
    type: boolean
    default: false
    scope: device
    security_class: secret
    ui_location: Settings/Security
    status: planned
  - key: security.lock_on_background
    type: enum
    values: [immediate, 30s, 1m, 5m]
    default: immediate
    scope: device
    security_class: secret
    ui_location: Settings/Security
    status: planned
  - key: security.flag_secure_sensitive
    type: boolean
    default: true
    scope: device
    security_class: sensitive
    ui_location: Settings/Security
    status: planned
  - key: backup.encrypted_manual_only
    type: boolean
    default: true
    scope: device
    security_class: secret
    ui_location: Settings/Backup
    status: planned
  - key: notifications.job_status
    type: enum
    values: [all, failures_only, off]
    default: failures_only
    scope: device
    security_class: sensitive
    ui_location: Settings/Notifications
    status: planned
  - key: advanced.verbose_local_logs
    type: boolean
    default: false
    scope: device
    security_class: sensitive
    ui_location: Settings/Advanced
    status: planned
