name: Kinetics CI

on:
  push:
    branches: [main, "kinetics/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "rdkit>=2023.9"

      - name: Lint new foundation modules
        run: python -m ruff check src/kinetics_core/proteomics.py
        # The standalone acquisition script uses compact API payload declarations; compile and fixture-test it separately.
        # Keep undefined-name/import checks on it without imposing source-package formatting rules.
        # Gallery downloader is exercised by its AST/domain/license regression tests. src/kinetics_core/pdb_adapter.py src/kinetics_core/mmcif_adapter.py src/kinetics_core/release_gate.py tests/test_pdb_adapter.py tests/test_mmcif_adapter.py tests/test_proteomics.py tests/test_release_gate.py src/kinetics_core/native_molecule.py tests/test_native_molecule.py scripts/verify_native_bridge.py scripts/build_pixel_animation.py scripts/validate_visual_assets.py tests/test_visual_assets.py src/kinetics_core/legacy.py src/kinetics_core/cli.py src/kinetics_core/__init__.py src/kinetics_core/persistence.py src/kinetics_core/catpred.py src/kinetics_core/curation.py src/kinetics_core/records.py src/kinetics_core/identity.py src/kinetics_core/release.py src/kinetics_core/quality.py src/kinetics_core/features.py src/kinetics_core/chemistry.py src/kinetics_core/sequence_clustering.py src/kinetics_core/partition.py src/kinetics_core/context.py src/kinetics_core/multimodal.py scripts/download_public_datasets.py scripts/inspect_public_datasets.py tests/test_legacy_adapter.py tests/test_persistence.py tests/test_catpred_adapter.py tests/test_kdb_release.py tests/test_measurement_semantics.py tests/test_representations.py tests/test_multimodal.py

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run test suite
        run: python -m pytest -q

  workbench:
    name: Research workbench integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install workbench and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workbench]"
      - name: Lint workbench
        run: python -m ruff check src/kinetics_core/workbench tests/test_workbench.py
      - name: Run workbench integration tests
        run: python -m pytest -q tests/test_workbench.py
      - name: Build and verify installable wheel
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
          kinetics-workbench --help
          python -c "from importlib.resources import files; assert files('kinetics_core.workbench').joinpath('static/index.html').is_file()"

  rust-infrastructure:
    name: Rust infrastructure
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KINETICS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/kinetics-infra
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/kinetics-infra
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets

  native:
    name: Native C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for interoperability test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kinetics package without scientific extras
        run: python -m pip install -e . --no-deps
      - name: Configure native engine
        run: cmake -S native -B build/native -DKINETICS_BUILD_TESTS=ON
      - name: Build native engine
        run: cmake --build build/native --config Release
      - name: Run native reference tests
        run: ctest --test-dir build/native --build-config Release --output-on-failure
      - name: Verify Python/C++ scene interoperability
        run: python scripts/verify_native_bridge.py

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -check -diff -recursive
      - name: Initialize providers
        run: terraform init -backend=false
      - name: Validate deployment configuration
        run: terraform validate

  browser-acceptance:
    name: Browser acceptance (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install workbench and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workbench,browser]"
          python -m playwright install --with-deps chromium
      - name: Run responsive and researcher-flow browser acceptance
        run: python -m pytest -q tests/test_workbench_browser.py

  visual-assets:
    name: Visual asset pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image and test dependencies
        run: python -m pip install "Pillow>=10,<13" "pytest>=7.4"
      - name: Generate and verify pixel animation
        run: |
          python scripts/build_pixel_animation.py
          python scripts/validate_visual_assets.py
      - name: Test gallery safeguards
        run: python -m pytest -q tests/test_visual_assets.py
