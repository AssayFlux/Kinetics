name: Kinetics knowledge corpus ingestion

on:
  schedule:
    - cron: "23 2 * * 1,4"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of bounded fetch cycles (1-3)"
        required: false
        default: "2"
        type: choice
        options: ["1", "2", "3"]
      batch_size:
        description: "Maximum documents per cycle (1-30)"
        required: false
        default: "30"
        type: string
      max_batch_mb:
        description: "Maximum download MiB per cycle (1-80)"
        required: false
        default: "80"
        type: string
      sync_artifacts:
        description: "Push public PDF/EPUB objects through Git LFS (uses quota)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: kinetics-knowledge-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate workflow limits
        env:
          CYCLES: ${{ inputs.cycles || '2' }}
          BATCH_SIZE: ${{ inputs.batch_size || '30' }}
          MAX_BATCH_MB: ${{ inputs.max_batch_mb || '80' }}
        run: |
          python - <<'PY'
          import os
          cycles, count, size = map(int, (
              os.environ["CYCLES"], os.environ["BATCH_SIZE"], os.environ["MAX_BATCH_MB"]
          ))
          if not 1 <= cycles <= 3 or not 1 <= count <= 30 or not 1 <= size <= 80:
              raise SystemExit("Limits exceeded: cycles 1-3, batch size 1-30, MiB 1-80")
          PY

      - name: Fetch, tokenize and analyze bounded batches
        env:
          CYCLES: ${{ inputs.cycles || '2' }}
          BATCH_SIZE: ${{ inputs.batch_size || '30' }}
          MAX_BATCH_MB: ${{ inputs.max_batch_mb || '80' }}
        run: |
          for cycle in $(seq 1 "$CYCLES"); do
            echo "Starting bounded ingestion cycle $cycle/$CYCLES"
            python scripts/fetch_corpus.py \
              --batch-size "$BATCH_SIZE" \
              --max-batch-mb "$MAX_BATCH_MB" \
              --max-domains 2
            python scripts/tokenize_corpus.py --max-documents 50
            python scripts/analyze_corpus.py
          done

      - name: Synchronize manifests and optional LFS objects
        env:
          SYNC_ARTIFACTS: ${{ inputs.sync_artifacts || 'false' }}
        run: |
          if [ "$SYNC_ARTIFACTS" = "true" ]; then
            python scripts/git_sync.py --mode lfs --push
          else
            python scripts/git_sync.py --mode manifest --push
          fi

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-ingestion-diagnostics
          path: |
            data/corpus-manifests/
          if-no-files-found: ignore
          retention-days: 14
