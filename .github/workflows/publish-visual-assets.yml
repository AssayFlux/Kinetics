name: Build and publish futuristic science gallery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-visual-assets.yml"
      - "scripts/generate_futuristic_gallery.py"
      - "scripts/build_pixel_animation.py"
      - "scripts/validate_visual_assets.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinetics-visual-assets
  cancel-in-progress: false

jobs:
  generate-and-publish:
    name: Generate 100 square science artworks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install "Pillow>=10,<13"

      - name: Generate all 100 original square PNG illustrations
        run: python scripts/generate_futuristic_gallery.py

      - name: Generate colourful looping pixel animation
        run: python scripts/build_pixel_animation.py

      - name: Validate all 100 images and animation
        run: python scripts/validate_visual_assets.py --strict-gallery

      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Assets/Future/PNG Assets/Future/ARTWORK_MANIFEST.json Assets/Future/ATTRIBUTION.json Assets/Future/kinetics-science-quest.gif
          if git diff --cached --quiet; then
            echo "No artwork changes to publish."
          else
            git commit -m "Publish 100 square futuristic science artworks [skip ci]"
            git push
          fi
