<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Kinetics Structure Viewer</title>
  <link rel="stylesheet" href="structure-viewer.css">
</head>
<body>
  <main class="viewer">
    <header class="toolbar">
      <div><strong>KINETICS</strong><span>STRUCTURE VIEWER</span></div>
      <label>Colour
        <select id="colour-mode" aria-label="Atom colour mode">
          <option value="element">Element</option><option value="chain">Chain</option>
        </select>
      </label>
      <button id="reset-view" type="button">Reset view</button>
    </header>
    <section class="stage" aria-label="Interactive molecular coordinate view">
      <canvas id="structure-canvas" aria-label="Structure atom coordinate plot"></canvas>
      <div id="empty-state" class="empty">Load a validated PDB or mmCIF coordinate payload to begin.</div>
      <div id="selection" class="selection" aria-live="polite">No atom selected</div>
    </section>
    <footer><span id="status" role="status">Waiting for structure payload</span><span>Coordinates only · No inferred bonds</span></footer>
    <ol id="atom-list" class="atom-list" aria-label="Structure atoms"></ol>
  </main>
  <script src="structure-viewer.js"></script>
</body>
</html>
