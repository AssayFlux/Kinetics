    implementation: python/kinetics/pharmvar.py
    evidence_level: none
  - id: phylo.nj_site_bootstrap
    name: Seeded nonparametric site-bootstrap support for Jukes-Cantor neighbour joining
    status: implemented
    implementation: python/kinetics/phylo.py
    evidence_level: none

  - id: structure.viewer_payload
    name: Bounded deterministic coordinate payload for offline structure viewers
    status: implemented
    implementation: python/kinetics/structure_view.py
    evidence_level: none

