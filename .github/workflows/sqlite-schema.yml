name: SQLite scientific schema validation

on:
  push:
    paths:
      - "database/sqlite/**"
      - "scripts/data/validate_sqlite_schema.py"
      - ".github/workflows/sqlite-schema.yml"
  pull_request:
    paths:
      - "database/sqlite/**"
      - "scripts/data/validate_sqlite_schema.py"
      - ".github/workflows/sqlite-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate base schema and migrations
        run: python scripts/data/validate_sqlite_schema.py
