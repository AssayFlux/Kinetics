name: Structure viewer validation

on:
  pull_request:
    paths:
      - "src/kinetics_core/biopython_tools.py"
      - "src/kinetics_core/workbench/**"
      - "tests/test_biopython_tools.py"
      - "tests/test_workbench.py"
      - "pyproject.toml"
  push:
    branches: ["kinetics/biopython-3d-structure-tools"]

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install structural workbench
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,workbench,structures]"
      - name: Lint structural modules
        run: python -m ruff check src/kinetics_core/biopython_tools.py src/kinetics_core/workbench tests/test_biopython_tools.py tests/test_workbench.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run structural and workbench tests
        run: python -m pytest -q tests/test_biopython_tools.py tests/test_pdb_adapter.py tests/test_mmcif_adapter.py tests/test_workbench.py
      - name: Verify packaged viewer assets
        run: |
          python -m build --wheel
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "kinetics_core/workbench/static/structure-viewer.html" in names
          PY
