[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetics-workbench"
version = "0.0.0"
description = "Offline-first scientific workbench foundations"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docking = [
  "vina==1.2.7",
]
dev = [
  "jsonschema[format]>=4.23,<5",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "PyYAML>=6,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
  "tomli>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "python"
strict = true

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
