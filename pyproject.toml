[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assayflux-kinetics"
version = "0.2.0"
description = "Reproducible enzyme kinetic data curation and research utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AssayFlux" }]
keywords = ["enzyme-kinetics", "Km", "kcat", "bioinformatics", "reproducible-research"]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2"
]

[project.optional-dependencies]
baseline = [
  "xgboost>=2.0,<4",
  "joblib>=1.3,<2",
  "biopython>=1.81,<2",
  "rdkit>=2023.9",
  "torch>=2.1",
  "transformers>=4.38,<5"
]
plots = ["matplotlib>=3.7"]

onnx = [
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "onnxmltools>=1.12",
  "skl2onnx>=1.16",
  "onnxconverter-common>=1.14"
]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "mypy>=1.8"]

[project.scripts]
kinetics-curate-catpred = "kinetics_core.catpred:main"
kinetics-research = "kinetics_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kinetics_core*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
