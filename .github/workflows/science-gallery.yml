name: Acquire real scientific domain images

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_science_gallery.py"
      - "scripts/build_pixel_animation.py"
      - "scripts/validate_visual_assets.py"
      - ".github/workflows/science-gallery.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinetics-science-gallery
  cancel-in-progress: false

jobs:
  acquire-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Download openly licensed real images for all 100 domains
        id: gallery
        shell: bash
        run: |
          set +e
          python scripts/import_science_gallery.py --start 1 --end 100
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "All 100 domain images were acquired."
          elif [ "$result" -eq 2 ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "The gallery is incomplete; successful downloads will be preserved and retried on the next scheduled run."
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Downloader failed with exit code $result; preserving any valid partial downloads."
          fi

      - name: Build the original colourful science-runner GIF
        run: python scripts/build_pixel_animation.py

      - name: Validate every acquired file and the animation
        run: python scripts/validate_visual_assets.py

      - name: Publish downloaded assets and attribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Assets/Future/PNG Assets/Future/ATTRIBUTION.json Assets/Future/kinetics-science-quest.gif
          if git diff --cached --quiet; then
            echo "No new assets to publish in this run."
          else
            git commit -m "Acquire real licensed scientific domain images"
            git push origin HEAD:main
          fi

      - name: Enforce 100-domain completion
        if: steps.gallery.outputs.complete != 'true'
        run: |
          echo "The image acquisition is still incomplete. Successful files were pushed when available; the scheduled workflow will retry missing domains."
          exit 1

      - name: Package the acquired gallery as a ZIP
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/kinetics-science-gallery.zip Assets/Future/PNG Assets/Future/ATTRIBUTION.json Assets/Future/kinetics-science-quest.gif || true
          test -s dist/kinetics-science-gallery.zip

      - name: Upload downloadable gallery ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinetics-science-gallery
          path: dist/kinetics-science-gallery.zip
          if-no-files-found: error
          retention-days: 30
