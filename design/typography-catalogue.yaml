  default_ui: Inter
  brand_script: Allura (candidate; restricted to wordmark/brand accent)
  display_serif: Cormorant Garamond (candidate; selected display headings only)
  default_scientific_monospace: JetBrains Mono
  system_fallback: sans-serif
  bundle_only_after_licence_audit: true
