name: Publish scientific visual assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-visual-assets.yml"
      - "scripts/import_science_gallery.py"
      - "scripts/build_pixel_animation.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinetics-visual-assets
  cancel-in-progress: false

jobs:
  acquire-and-publish:
    name: Acquire images and publish animation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processing dependency
        run: python -m pip install "Pillow>=10,<13"

      - name: Acquire 24 licensed scientific images
        run: python scripts/import_science_gallery.py --start 1 --end 24

      - name: Generate colourful looping pixel animation
        run: python scripts/build_pixel_animation.py

      - name: Validate generated assets
        run: python scripts/validate_visual_assets.py

      - name: Commit generated assets to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Assets/Future/PNG Assets/Future/ATTRIBUTION.json Assets/Future/kinetics-science-quest.gif
          if git diff --cached --quiet; then
            echo "No visual asset changes to publish."
          else
            git commit -m "Add licensed scientific image gallery and pixel animation [skip ci]"
            git push
          fi
