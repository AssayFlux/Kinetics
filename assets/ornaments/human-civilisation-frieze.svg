<title id="t">Human civilisation and evolution panoramic frieze</title><desc id="d">A continuous antique engraving in seven equal chapters, ordered India, China, Japan, Europe, Africa, Middle East, and branching human evolutionary history. Each culture is represented by distinct architecture and decorative traditions; the final chapter uses branching hominin lineages and stone tools rather than a linear ape-to-human sequence.</desc>
<defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff8e7"/><stop offset=".5" stop-color="#ead9b4"/><stop offset="1" stop-color="#d9bd83"/></linearGradient><pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M0 18Q9 8 19 18T38 18" fill="none" stroke="#800020" stroke-opacity=".08"/><circle cx="8" cy="8" r="1" fill="#6d4b25" fill-opacity=".15"/></pattern><g id="column" fill="none" stroke="#5c3824" stroke-width="2"><path d="M0 0V-90M-10-90H10M-7-82H7M-8 0H8"/></g></defs>
<rect width="2100" height="250" fill="url(#paper)"/><rect width="2100" height="250" fill="url(#grain)"/><rect x="7" y="7" width="2086" height="236" rx="8" fill="none" stroke="#9a6b2d" stroke-width="3"/><path d="M14 27H2086M14 222H2086" stroke="#800020" stroke-width="2"/><path d="M14 34H2086M14 215H2086" stroke="#b28b45" stroke-width="1"/>
