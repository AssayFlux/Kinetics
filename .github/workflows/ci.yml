name: Kinetics source validation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kinetics-source-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-foundations:
    name: Python foundation, registry and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Install Kinetics research package
        run: python -m pip install -e .
      - name: Ruff lint
        run: ruff check scripts tests python
      - name: Mypy
        run: mypy scripts tests python
      - name: Registry validation
        run: python scripts/check_registry.py
      - name: Unit tests
        run: pytest
      - name: Reproduction stub
        run: scripts/reproduce-all
      - name: Android artifact gate status
        run: python scripts/check_android_artifacts.py
      - name: Check local Android build script syntax
        run: bash -n scripts/build_android_local.sh
# Owner instruction (2026-11-08): GitHub Actions must not build APK/AAB files
# or boot/test Android emulators. Build the debug APK locally when requested;
# physical-device testing is deferred until the owner is ready.
