name: Kinetics CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kinetics-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-foundations:
    name: Python foundation, registry and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Ruff lint
        run: ruff check scripts tests
      - name: Mypy
        run: mypy scripts tests
      - name: Registry validation
        run: python scripts/check_registry.py
      - name: Unit tests
        run: pytest
      - name: Reproduction stub
        run: scripts/reproduce-all
      - name: Android artifact gate status
        run: python scripts/check_android_artifacts.py
  android-r1:
    name: R1 Android arm64 feasibility build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify runner Android SDK tools
        run: sdkmanager --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          yes | sdkmanager --licenses
      - name: Build arm64 debug APK and bundle
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug
      - name: Check APK ZIP alignment
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Report APK size and upload artifacts
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/bundle/debug/app-debug.aab
      - uses: actions/upload-artifact@v4
        with:
          name: kinetics-r1-android-arm64
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
