name: Build Kinetics animation

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/build_pixel_animation.py"
      - "scripts/validate_visual_assets.py"
      - ".github/workflows/science-gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinetics-animation
  cancel-in-progress: false

jobs:
  build-animation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install animation tooling
        run: python -m pip install --upgrade Pillow

      - name: Build the original Kinetics science animation
        run: python scripts/build_pixel_animation.py

      - name: Validate the animation-only repository visuals
        run: python scripts/validate_visual_assets.py

      - name: Publish the animation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Assets/Future/kinetics-science-quest.gif
          if git diff --cached --quiet; then
            echo "The animation is already current."
          else
            git commit -m "Build Kinetics science quest animation"
            git push origin HEAD:main
          fi
