name: Kinetics knowledge corpus ingestion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bulk_downloader.yml"
      - "scripts/fetch_corpus.py"
      - "scripts/fetch_research_data.py"
      - "scripts/fetch_specialist_sources.py"
      - "scripts/tokenize_corpus.py"
      - "database/sources/knowledge_sources.json"
      - "requirements-knowledge.txt"
  schedule:
    - cron: "23 2 * * 1,4"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of bounded fetch cycles (1-3)"
        required: false
        default: "3"
        type: choice
        options: ["1", "2", "3"]
      batch_size:
        description: "Maximum objects per cycle (3-30)"
        required: false
        default: "30"
        type: string
      max_batch_mb:
        description: "Maximum download MiB per cycle (3-240)"
        required: false
        default: "240"
        type: string
      sync_mode:
        description: "Durable corpus storage target"
        required: false
        default: "release"
        type: choice
        options: ["release", "lfs", "manifest"]

permissions:
  contents: write

concurrency:
  group: kinetics-knowledge-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-knowledge.txt

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-knowledge.txt

      - name: Validate workflow limits
        env:
          CYCLES: ${{ inputs.cycles || '2' }}
          BATCH_SIZE: ${{ inputs.batch_size || '30' }}
          MAX_BATCH_MB: ${{ inputs.max_batch_mb || '240' }}
        run: |
          python - <<'PY'
          import os
          cycles, count, size = map(int, (
              os.environ["CYCLES"], os.environ["BATCH_SIZE"], os.environ["MAX_BATCH_MB"]
          ))
          if not 1 <= cycles <= 3 or not 3 <= count <= 30 or not 3 <= size <= 240:
              raise SystemExit("Limits exceeded: cycles 1-3, batch size 3-30, MiB 3-240")
          PY

      - name: Fetch, tokenize and analyze bounded batches
        env:
          CYCLES: ${{ inputs.cycles || '2' }}
          BATCH_SIZE: ${{ inputs.batch_size || '30' }}
          MAX_BATCH_MB: ${{ inputs.max_batch_mb || '80' }}
        run: |
          IA_BATCH=$(( BATCH_SIZE / 3 ))
          ZENODO_BATCH=$(( BATCH_SIZE / 3 ))
          SPECIALIST_BATCH=$(( BATCH_SIZE - IA_BATCH - ZENODO_BATCH ))
          IA_MB=$(( MAX_BATCH_MB / 3 ))
          ZENODO_MB=$(( MAX_BATCH_MB / 3 ))
          SPECIALIST_MB=$(( MAX_BATCH_MB - IA_MB - ZENODO_MB ))
          for cycle in $(seq 1 "$CYCLES"); do
            echo "Starting bounded multi-source ingestion cycle $cycle/$CYCLES"
            python scripts/fetch_corpus.py \
              --batch-size "$IA_BATCH" \
              --max-batch-mb "$IA_MB" \
              --max-domains 8
            python scripts/fetch_research_data.py \
              --batch-size "$ZENODO_BATCH" \
              --max-batch-mb "$ZENODO_MB" \
              --max-file-mb "$ZENODO_MB" \
              --max-domains 8
            python scripts/fetch_specialist_sources.py \
              --batch-size "$SPECIALIST_BATCH" \
              --max-batch-mb "$SPECIALIST_MB" \
              --max-file-mb "$SPECIALIST_MB" \
              --max-domains 8 \
              --per-source-limit 3
            python scripts/tokenize_corpus.py --max-documents 1000
            python scripts/analyze_corpus.py
          done

      - name: Synchronize manifests and corpus objects
        env:
          SYNC_MODE: ${{ inputs.sync_mode || 'release' }}
        run: |
          python scripts/git_sync.py --mode "$SYNC_MODE" --push

      - name: Upload run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-ingestion-diagnostics
          path: |
            data/corpus-manifests/
          if-no-files-found: ignore
          retention-days: 14
