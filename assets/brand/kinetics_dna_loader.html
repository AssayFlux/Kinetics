<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainbow Helix</title>
<style>
  :root { --bg: #fafcff; }               /* set to "transparent" if you embed it over your own background */
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="helix" aria-label="Animated rainbow helix" role="img"></canvas>

<script>
/* ---------- Settings: tweak these ---------- */
const CONFIG = {
  dots: 99,            // dots per strand
  widthRatio: 0.71,    // helix width relative to viewport width (max capped below)
  maxWidth: 760,       // px
  amplitude: 0.17,     // wave height relative to helix width
  turns: 1.9,          // how many full twists across the helix
  speed: 1.1,          // rotation speed (radians / second)
  dotSize: 12,         // base dot radius (px at 1x)
  hueSpan: 500,        // rainbow spread across the helix (degrees)
  hueDrift: 19,        // hue shift per second (makes colours flow)
  saturation: 91,      // %
  lightness: 63,       // % (higher = lighter pastel)
  bob: 7               // gentle floating motion (px), 0 to disable
};

const canvas = document.getElementById('helix');
const ctx = canvas.getContext('2d');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function draw(now) {
  const t = reduceMotion ? 0 : now / 1000;
  ctx.clearRect(0, 0, W, H);

  const width = Math.min(W * CONFIG.widthRatio * 1.6, CONFIG.maxWidth, W * 0.9);
  const amp = width * CONFIG.amplitude;
  const left = (W - width) / 2;
  const step = width / (CONFIG.dots - 1);
  const cy = H / 2;
  const scale = Math.max(0.6, Math.min(1.6, width / 560));
  const items = [];

  for (let i = 0; i < CONFIG.dots; i++) {
    const u = i / (CONFIG.dots - 1);
    const phase = u * Math.PI * 2 * CONFIG.turns - t * CONFIG.speed;
    const x = left + i * step;
    const float = Math.sin(t * 1.3 + i * 0.5) * CONFIG.bob * scale;
    const hue = (u * CONFIG.hueSpan + t * CONFIG.hueDrift) % 360;

    for (let s = 0; s < 2; s++) {
      const p = phase + s * Math.PI;         // second strand is opposite
      const y = cy + Math.sin(p) * amp + float;
      const z = Math.cos(p);                  // -1 (back) .. 1 (front)
      const depth = (z + 1) / 2;              // 0 .. 1
      items.push({
        x, y, depth,
        r: CONFIG.dotSize * scale * (0.5 + 0.6 * depth),
        hue: (hue + s * 40) % 360,
        a: 0.45 + 0.55 * depth,
        l: CONFIG.lightness + (1 - depth) * 8 // back dots slightly lighter
      });
    }
  }

  items.sort((a, b) => a.depth - b.depth);    // back first, front last

  for (const d of items) {
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${d.hue}, ${CONFIG.saturation}%, ${d.l}%, ${d.a})`;
    ctx.fill();
  }

  if (!reduceMotion) requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
