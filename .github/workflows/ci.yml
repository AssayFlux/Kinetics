name: Kinetics CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kinetics-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-foundations:
    name: Python foundation, registry and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Ruff lint
        run: ruff check scripts tests
      - name: Mypy
        run: mypy scripts tests
      - name: Registry validation
        run: python scripts/check_registry.py
      - name: Unit tests
        run: pytest
      - name: Reproduction stub
        run: scripts/reproduce-all
      - name: Android artifact gate status
        run: python scripts/check_android_artifacts.py
  android-r1:
    name: R1 Android arm64 feasibility build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          yes | sdkmanager --licenses
      - name: Install wheel-build system tools
        run: sudo apt-get update && sudo apt-get install -y patch patchelf
      - name: Fetch pinned Chaquopy wheel builder and Python 3.11 target
        run: |
          git clone --depth 1 --branch 17.2.0 https://github.com/chaquo/chaquopy.git "$RUNNER_TEMP/chaquopy"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "chaquopy/server/pypi/build-wheel.py"
          source = path.read_text()
          old = 'run(f"ln -s {filename} {reqs_lib_dir}/{link_filename}")'
          new = 'run(f"ln -sf {filename} {reqs_lib_dir}/{link_filename}")'
          if old not in source:
              raise SystemExit("Expected Chaquopy SONAME alias line was not found")
          path.write_text(source.replace(old, new, 1))
          wrapper = path.with_name("compiler-wrapper.py")
          wrapper_source = wrapper.read_text()
          safe_old = 'valid_dirs = [abspath(f"{dirname(sys.argv[0])}/../..")]'
          safe_new = 'valid_dirs = [abspath(f"{dirname(sys.argv[0])}/../.."), abspath(os.environ["GITHUB_WORKSPACE"])]'
          if safe_old not in wrapper_source:
              raise SystemExit("Expected Chaquopy compiler-wrapper safe-path line was not found")
          wrapper.write_text(wrapper_source.replace(safe_old, safe_new, 1))
          PY
          cd "$RUNNER_TEMP/chaquopy"
          target/download-target.sh maven/com/chaquo/python/target/3.11.17-0
      - name: Prepare Chaquopy wheel builder
        run: |
          python -m pip install -r "$RUNNER_TEMP/chaquopy/server/pypi/requirements.txt"
          mkdir -p "$RUNNER_TEMP/chaquopy/server/pypi/dist/numpy"
          curl --fail --location --retry 3 \
            https://chaquo.com/pypi-13.1/numpy/numpy-1.26.2-0-cp311-cp311-android_21_arm64_v8a.whl \
            --output "$RUNNER_TEMP/chaquopy/server/pypi/dist/numpy/numpy-1.26.2-0-cp311-cp311-android_21_arm64_v8a.whl"
      - name: Cross-build pinned Biopython 1.88 Android wheel
        run: |
          cd "$RUNNER_TEMP/chaquopy/server/pypi"
          python build-wheel.py --python 3.11 --abi arm64-v8a "$GITHUB_WORKSPACE/android/biopython-wheel"
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs/python-wheels"
          cp dist/biopython/*.whl "$GITHUB_WORKSPACE/android/app/libs/python-wheels/"
          sha256sum "$GITHUB_WORKSPACE"/android/app/libs/python-wheels/*.whl
      - name: Build arm64 debug APK and bundle
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug
      - name: Check APK ZIP alignment
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
      - name: Report APK size and upload artifacts
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/bundle/debug/app-debug.aab
      - uses: actions/upload-artifact@v4
        with:
          name: kinetics-r1-android-arm64
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
