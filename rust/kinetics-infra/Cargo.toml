[package]
name = "kinetics-infra"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Security and systems primitives for the Kinetics research platform"

[dependencies]
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-secretsmanager = "1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.5", features = ["trace", "limit", "request-id", "sensitive-headers"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "kinetics-api"
path = "src/main.rs"

[[bin]]
name = "kinetics-worker"
path = "src/bin/worker.rs"
