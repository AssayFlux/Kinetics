name: Acquire open scientific starter data

on:
  workflow_dispatch:
    inputs:
      source_ids:
        description: "Comma-separated enabled starter source IDs (default: all enabled)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  acquire-starter-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download enabled open ontology packs
        shell: bash
        run: |
          set -euo pipefail
          ids="${{ inputs.source_ids }}"
          if [ -z "$ids" ]; then
            python scripts/data/fetch_seed_data.py
          else
            IFS=',' read -ra sources <<< "$ids"
            args=()
            for source in "${sources[@]}"; do
              args+=(--source "$(echo "$source" | xargs)")
            done
            python scripts/data/fetch_seed_data.py "${args[@]}"
          fi
      - name: Commit verified starter data and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/seed
          if git diff --cached --quiet; then
            echo "No new starter data to commit."
          else
            git commit -m "Add verified scientific starter data"
            git push
          fi
